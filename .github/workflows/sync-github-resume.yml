name: Sync GitHub projects to resume

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "student-portfolio/scripts/sync_github_resume.py"
      - ".github/workflows/sync-github-resume.yml"

permissions:
  contents: write

concurrency:
  group: sync-github-resume
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF generator
        run: python -m pip install --disable-pip-version-check -r student-portfolio/requirements-resume.txt

      - name: Fetch repositories and regenerate resume
        env:
          GITHUB_USERNAME: 24ce094-lang
        run: python student-portfolio/scripts/sync_github_resume.py

      - name: Commit generated resume data and PDF
        run: |
          if git diff --quiet -- student-portfolio/src/data/github-repositories.json student-portfolio/public/shaswat_patel_resume.pdf; then
            echo "Generated resume is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-portfolio/src/data/github-repositories.json student-portfolio/public/shaswat_patel_resume.pdf
          git commit -m "chore: sync GitHub projects to resume"
          git push
